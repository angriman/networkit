[project]
name = "networkit"
dynamic = ["version"]
description = "NetworKit is a toolbox for high-performance network analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "License.txt"}
keywords =["graph algorithm", "network analysis", "social network"]
authors = [
  {name = "Christian L. Staudt"},
  {name = "Henning Meyerhenke"}
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Environment :: Other Environment",
  "Framework :: IPython",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Visualization"
]

dependencies = [
  "scipy",
  "numpy",
  "tabulate"
]

[project.urls]
homepage = "https://networkit.github.io/"
documentation = "https://networkit.github.io/dev-docs/index.html"
repository = "https://github.com/networkit/networkit"
changelog = "https://github.com/networkit/networkit/blob/master/CHANGES.md"


[build-system]
requires = [
  "cython>=3.0.9,<3.3.0",
  "numpy",
  "scikit-build-core>=0.11"
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.21"
cmake.build-type = "Release"
wheel.packages = ["networkit"]
wheel.exclude = ["cpp/", "**.cpp"]
sdist.include = [
  "extlibs/dhb/CMakeLists.txt",
  "extlibs/dhb/Config.cmake.in",
  "extlibs/dhb/LICENSE",
  "extlibs/dhb/include/",
  "extlibs/dhb/src/",
  "extlibs/tlx/CMakeLists.txt",
  "extlibs/tlx/LICENSE",
  "extlibs/tlx/misc/",
  "extlibs/tlx/tlx/",
  "extlibs/ttmath/COPYRIGHT",
  "extlibs/ttmath/ttmath/"
]
sdist.exclude = [
  ".*",
  "/benchmarks/",
  "/docs/",
  "/extlibs/",
  "/extrafiles/",
  "/input/",
  "/notebooks/",
  "/scripts/"
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "version.py"

[tool.scikit-build.cmake.define]
NETWORKIT_FLATINSTALL = "ON"
NETWORKIT_BUILD_TESTS = {env = "NETWORKIT_BUILD_TESTS", default = "OFF"}
NETWORKIT_BUILD_CORE = {env = "NETWORKIT_BUILD_CORE", default = "ON"}
NETWORKIT_EXT_TLX = {env = "NETWORKIT_EXT_TLX", default = ""}

# Only static core builds are supported on Windows.
[[tool.scikit-build.overrides]]
if.platform-system = "win32"
inherit.cmake.define = "append"
cmake.define.NETWORKIT_STATIC = "ON"
cmake.define.NETWORKIT_BUILDING_STATELIB = "ON"
